[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-site-safety-inspector"
version = "0.1.0"
description = "OpenEnv-style environment for construction site safety inspection and OSHA citation grading."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "openai==2.7.2",
  "openenv-core==0.2.3",
  "pydantic==2.11.7",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.35.0",
]

[project.scripts]
server = "server.app:main"

[tool.setuptools.packages.find]
include = ["construction_safety_env*", "server*"]
